# Production stack for the wedding site. Copy this folder to the server,
# fill in .env (see .env.example) and follow README.md.
#
#   Caddy (80/443, HTTPS) ─┬─ https://SITE_DOMAIN/              → web (Nuxt) ──┐
#                          └─ https://SITE_DOMAIN/admin-portal  → directus  ←──┘ (server-side lookups)
#                                                                   └─ postgres
#
# Only Caddy is reachable from outside; nothing else publishes a port.
name: e-wedding

services:
  postgres:
    image: postgres:17.0
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: ghcr.io/sovannthai/api-e-wedding:${API_TAG:-develop}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SECRET: ${DIRECTUS_SECRET}
      # Served under /admin-portal on the site's domain; Caddy strips the prefix
      PUBLIC_URL: https://${SITE_DOMAIN}/admin-portal

      DB_CLIENT: pg
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      # Only used the first time, to create the admin user
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      CORS_ENABLED: "true"
      CORS_ORIGIN: https://${SITE_DOMAIN}

      WEBSOCKETS_ENABLED: "false"
      TELEMETRY: "false"
    volumes:
      - directus_uploads:/directus/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    image: ghcr.io/sovannthai/e-invitation-wedding:${WEB_TAG:-develop}
    restart: unless-stopped
    depends_on:
      directus:
        condition: service_healthy
    environment:
      # Server-side only: the website talks to Directus inside the Docker
      # network, and the token never reaches the browser.
      NUXT_DIRECTUS_URL: http://directus:8055
      NUXT_DIRECTUS_TOKEN: ${NUXT_DIRECTUS_TOKEN}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - directus
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here — keep the volume or Caddy re-issues them
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  directus_uploads:
  caddy_data:
  caddy_config:
